[package]
name = "tern"
version = "0.1.0"
description = "A free, open source SSH and SFTP client"
authors = ["The Tern contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.63.3"
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
portable-pty = "0.9.0"
dirs = "7.0.0"
keyring = "4.2.0"
tauri-plugin-dialog = "2"
aes-gcm = "0.11.1"
getrandom = "0.3"
zeroize = "1.9.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
